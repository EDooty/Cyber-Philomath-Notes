<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Philomath - Note Engine</title>
    <!-- Core Dependencies -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0d1117; --sidebar-bg: #161b22; --accent: #58a6ff;
            --text: #c9d1d9; --card: #21262d; --danger: #f85149;
            --success: #238636; --input-bg: #0d1117; --input-border: #30363d;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: row; height: 100vh; margin: 0; overflow: hidden; }

        /* --- LEFT PANE: MARKDOWN EDITOR --- */
        #left-pane {
            flex-grow: 1; display: flex; flex-direction: column;
            background: var(--bg); border-right: 1px solid var(--input-border);
            min-width: 0;
        }
        .editor-header {
            padding: 15px 20px; font-size: 11px; font-weight: bold; color: #8b949e;
            text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--input-border);
            background: var(--sidebar-bg);
            flex-shrink: 0; display: flex; justify-content: space-between;
        }
        #markdown-editor {
            flex-grow: 1; width: 100%; background: var(--bg); border: none;
            color: var(--text); padding: 25px; box-sizing: border-box; font-family: 'Fira Code', monospace;
            font-size: 14px; line-height: 1.6; resize: none; outline: none; overflow-y: auto;
        }

        /* --- RIGHT PANE: TOOLS & MINI-MAP --- */
        #right-pane {
            width: 40vw; min-width: 450px; display: flex; flex-direction: column;
            background: var(--sidebar-bg); z-index: 10;
        }

        /* TOOLS SECTION */
        #tools-section { padding: 15px; border-bottom: 1px solid var(--input-border); background: var(--card); flex-shrink: 0; }
        h2 { margin: 0 0 10px 0; color: var(--accent); font-weight: bold; letter-spacing: 1px; font-size: 12px; text-transform: uppercase; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }

        .btn { background: #30363d; color: var(--text); border: 1px solid var(--input-border); padding: 8px; cursor: pointer; font-weight: bold; border-radius: 6px; font-size: 11px; text-transform: uppercase; transition: 0.2s; text-align: center; }
        .btn:hover { background: #3c444d; border-color: #8b949e; }
        .btn-danger { background: #da3633; color: white; border: none; }
        .btn-success { background: var(--success); color: white; border: none; }

        /* GALLERY - 3 Columns */
        #gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            overflow-x: hidden;
            margin-top: 10px;
            padding-right: 5px;
            box-sizing: border-box;
        }
        .gallery-item {
            position: relative; width: 100%; display: flex; flex-direction: column; align-items: center;
            background: var(--card); padding: 5px; border-radius: 6px; border: 1px solid var(--input-border); box-sizing: border-box;
        }
        .thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; cursor: zoom-in; background: #000; }
        .img-del-btn { position: absolute; top: -4px; right: -4px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; cursor: pointer; z-index: 5; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .img-label { font-size: 9px; color: #8b949e; text-align: center; margin-top: 4px; width: 100%; word-break: break-all; font-family: 'Fira Code', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MINI FLOWCHART */
        #network-container { flex-grow: 1; position: relative; background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
        .map-header { padding: 10px 15px; font-size: 11px; font-weight: bold; color: var(--accent); text-transform: uppercase; background: var(--sidebar-bg); border-bottom: 1px solid var(--input-border); flex-shrink: 0; }
        #network-wrapper { flex-grow: 1; position: relative; min-height: 0; overflow: hidden; }
        #mynetwork { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; cursor: grab; }

        /* LIGHTBOX */
        #lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;}
        #lightbox img { max-width: 100%; max-height: 100%; border: 1px solid var(--input-border); box-shadow: 0 0 20px rgba(0,0,0,0.5); object-fit: contain; }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="lightbox-img" src=""></div>
<input type="hidden" id="root-name" value="Target">
<input type="file" id="load-input" style="display:none" accept=".json" onchange="loadData(this)">
<input type="file" id="manual-upload" style="display:none" accept="image/*" onchange="handleFileUpload(this)">

<textarea id="default-template" style="display:none;">
# [Target Name] [Date]

```attackpath
- Target
 - Discovery
  - Web|Directories
   - `gobuster`
    - /admin
 - Initial Access
  - *Vulnerability*|CVE-2021-44228
```

## [T1] - [IP]

| Port | Service |
|------|---------|
|      |         |

### Discovery

#### Web

### Vulnerabilities

### Loot

</textarea>

<div id="left-pane">
    <div class="editor-header">
        <span>Engagement Notes (Markdown)</span>
	<span style="color: var(--accent);"><font color=white>ALT+T</font>: Insert Timestamp <br><font color=white>CTRL+V</font>: Paste Screenshot <br><font color=white>|</font>: Flowchart Newline</span>
    </div>
    <textarea id="markdown-editor" spellcheck="false" oninput="debouncedParse()"></textarea>
</div>

<div id="right-pane">
    <div id="tools-section">
        <h2>Workspace Tools</h2>
        <div class="row">
            <button class="btn btn-success" onclick="saveData()">Save Workspace</button>
            <button class="btn" onclick="document.getElementById('load-input').click()">Load Workspace</button>
        </div>
        <div class="row">
            <button id="btn-export-png" class="btn" onclick="exportImage()">Export Super-HD Map</button>
            <button class="btn" onclick="exportMarkdown()">Export Notes (MD)</button>
        </div>
        <button class="btn" style="background:#d29922; color:#fff; border:none; width: 100%; margin-bottom: 10px;" onclick="exportZip()">Export Evidence (ZIP)</button>
        <button class="btn btn-danger" style="width: 100%; margin-bottom: 10px;" onclick="resetAll()">Reset Workspace</button>
        <div style="border-top: 1px solid var(--input-border); padding-top: 10px;">
            <button class="btn" style="width: 100%;" onclick="document.getElementById('manual-upload').click()">+ Upload Screenshot</button>
            <div id="gallery"></div>
        </div>
    </div>
    <div id="network-container">
        <div class="map-header">Live Attack Path</div>
        <div id="network-wrapper"><div id="mynetwork"></div></div>
    </div>
</div>

<script>
    // Suppress benign ResizeObserver warnings
    window.addEventListener('error', function(e) { if (e.message && e.message.includes('ResizeObserver')) e.stopImmediatePropagation(); });

    let images = [];
    let network = null;
    let parseTimeout = null;
    let globalNodes = new vis.DataSet();
    let globalEdges = new vis.DataSet();

    window.onload = function() {
        document.getElementById('markdown-editor').value = document.getElementById('default-template').value.trim();
        parseNotesToGraph();
    };

    document.getElementById('markdown-editor').addEventListener('keydown', function(e) {
        if (e.altKey && e.key.toLowerCase() === 't') {
            e.preventDefault();
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const timestamp = `[${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}] `;
            const start = this.selectionStart;
            this.value = this.value.substring(0, start) + timestamp + this.value.substring(this.selectionEnd);
            this.selectionStart = this.selectionEnd = start + timestamp.length;
            debouncedParse();
        }
    });

    function debouncedParse() {
        clearTimeout(parseTimeout);
        parseTimeout = setTimeout(() => { parseNotesToGraph(); }, 300);
    }

    function parseNotesToGraph() {
        try {
            const text = document.getElementById('markdown-editor').value;
            const regex = /\x60\x60\x60(?:attackpath|map|graph)\s*\n([\s\S]*?)(?:\x60\x60\x60|$)/i;
            const match = text.match(regex);
            let parsedNodes = [];
            globalNodes.clear(); globalEdges.clear();
            let rootName = "Target";

            if (match) {
                const lines = match[1].split('\n');
                let stack = [];
                let isFirst = true;

                lines.forEach(line => {
                    if (line.trim() === '') return;
                    const bulletMatch = line.match(/^([ \t]*)([\*\-\+])\s*(.*)$/);
                    if (bulletMatch) {
                        const indent = bulletMatch[1].replace(/\t/g, '    ').length;
                        // Replace pipe with actual newline for Markdown-enabled Vis.js labels
                        let content = bulletMatch[3].trim().replace(/\|/g, '\n');
                        if (isFirst) {
                            rootName = content.split('\n')[0].replace(/[*`]/g, '');
                            stack.push({ indent, id: 'root' });
                            parsedNodes.push({ id: 'root', name: content, parent: null, depth: 0 });
                            isFirst = false;
                        } else {
                            while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
                            const parentId = stack.length > 0 ? stack[stack.length - 1].id : 'root';
                            const nodeId = 'n_' + Math.random().toString(36).substr(2, 9);
                            parsedNodes.push({ id: nodeId, name: content, parent: parentId, depth: stack.length });
                            stack.push({ indent, id: nodeId });
                        }
                    }
                });
            }
            document.getElementById('root-name').value = rootName;
            buildVisDatasets(parsedNodes);
            renderMap(document.getElementById('mynetwork'), globalNodes, globalEdges);
        } catch (err) { console.error(err); }
    }

    function buildVisDatasets(parsedNodes) {
        const colors = [
            { bg: '#21262d', br: '#58a6ff', tx: '#c9d1d9' },
            { bg: '#1f6feb', br: '#30363d', tx: '#ffffff' },
            { bg: '#238636', br: '#30363d', tx: '#ffffff' },
            { bg: '#d29922', br: '#30363d', tx: '#ffffff' },
            { bg: '#8957e5', br: '#30363d', tx: '#ffffff' },
            { bg: '#f85149', br: '#30363d', tx: '#ffffff' }
        ];

        parsedNodes.forEach(n => {
            const c = colors[n.depth > 5 ? 5 : n.depth];
            globalNodes.add({
                id: n.id, label: n.name, level: n.depth, shape: 'box', borderWidth: 2, margin: 15, shadow: true,
                color: { background: c.bg, border: c.br, highlight: { background: c.bg, border: '#ffffff' } },
                font: {
                    multi: 'md',
                    color: c.tx,
                    align: 'center',
                    face: "'Segoe UI', sans-serif",
                    size: 14,
                    bold: { color: '#ffffff' },
                    mono: { color: '#000000', face: "'Fira Code', monospace" } // Black code commands
                }
            });
            if (n.parent) globalEdges.add({ from: n.parent, to: n.id, arrows: 'to', color: { color: '#58a6ff' }, width: 2, smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.5 } });
        });
    }

    function renderMap(container, nodes, edges) {
        const options = {
            layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', nodeSpacing: 150, levelSeparation: 100, parentCentralization: true } },
            physics: { enabled: false },
            interaction: { dragNodes: true, dragView: true, zoomView: true, hover: true }
        };
        if (network && container.id === 'mynetwork') {
            const scale = network.getScale(); const pos = network.getViewPosition();
            network.destroy();
            network = new vis.Network(container, { nodes, edges }, options);
            network.moveTo({ position: pos, scale: scale });
        } else {
            let net = new vis.Network(container, { nodes, edges }, options);
            if (container.id === 'mynetwork') network = net;
            return net;
        }
    }

    // ==========================================
    // NATIVE OS SAVE DIALOG INTEGRATION
    // ==========================================
    async function saveWithDialog(blob, defaultName, description, mimeType, extension) {
        try {
            // Attempt to invoke the modern Native File System Access API
            if (window.showSaveFilePicker) {
                const handle = await window.showSaveFilePicker({
                    suggestedName: defaultName,
                    types: [{
                        description: description,
                        accept: { [mimeType]: ['.' + extension] },
                    }],
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                return; // Successfully saved via Native OS Dialog
            }
        } catch (err) {
            if (err.name === 'AbortError') return; // User clicked "Cancel" in the native dialog
            console.warn("Native Save Dialog failed or is blocked by Sandbox. Falling back to standard download.", err);
        }

        // Fallback: Standard browser download if Native API is unavailable/blocked.
        // This will pop up a dialog ONLY IF your browser settings are set to "Ask where to save each file"
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = defaultName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // ==========================================
    // SUPER-HD TRANSPARENT EXPORT ENGINE
    // ==========================================
    async function getHighResImageData() {
        return new Promise((resolve) => {
            const btn = document.getElementById('btn-export-png');
            const originalText = btn.innerText;
            btn.innerText = "RENDERING HD...";

            // 1. Create a massive ghost container
            const ghostContainer = document.createElement('div');
            ghostContainer.style.width = '6000px';
            ghostContainer.style.height = '4500px';
            ghostContainer.style.position = 'absolute';
            ghostContainer.style.left = '-10000px';
            ghostContainer.style.top = '-10000px';
            ghostContainer.style.background = 'transparent';
            document.body.appendChild(ghostContainer);

            // 2. Render ghost network
            const ghostNetwork = renderMap(ghostContainer, globalNodes, globalEdges);

            setTimeout(() => {
                ghostNetwork.fit();
                setTimeout(() => {
                    const canvas = ghostContainer.querySelector('canvas');
                    const finalCanvas = document.createElement('canvas');
                    finalCanvas.width = canvas.width;
                    finalCanvas.height = canvas.height;
                    const ctx = finalCanvas.getContext('2d');
                    ctx.drawImage(canvas, 0, 0);

                    const dataUrl = finalCanvas.toDataURL('image/png', 1.0);

                    ghostNetwork.destroy();
                    document.body.removeChild(ghostContainer);
                    btn.innerText = originalText;
                    resolve(dataUrl);
                }, 300);
            }, 800); // Give extra time for the 5x render to settle
        });
    }

    async function exportImage() {
        const dataUrl = await getHighResImageData();
        if (!dataUrl) return;

        // Convert DataURL to Blob for the Native Save Dialog
        const res = await fetch(dataUrl);
        const blob = await res.blob();

        const root = (document.getElementById('root-name').value || "engagement").replace(/[^\w\s-]/gi, '_');
        saveWithDialog(blob, root + "_hd_map.png", "HD Attack Map", "image/png", "png");
    }

    async function exportZip() {
        const root = (document.getElementById('root-name').value || "engagement").replace(/[^\w\s-]/gi, '_');
        const zip = new JSZip();

        if (images.length > 0) {
            const folder = zip.folder("screenshots");
            images.forEach(img => folder.file(img.name, img.data.split(',')[1], {base64: true}));
        }

        const hdMap = await getHighResImageData();
        zip.file(root + "_transparent_map.png", hdMap.split(',')[1], {base64: true});
        zip.file("notes.md", document.getElementById('markdown-editor').value);

        const blob = await zip.generateAsync({type:"blob"});
        saveWithDialog(blob, root + "_evidence.zip", "ZIP Archive", "application/zip", "zip");
    }

    function saveData() {
        const root = (document.getElementById('root-name').value || "engagement").replace(/[^\w\s-]/gi, '_');
        const blob = new Blob([JSON.stringify({ markdown: document.getElementById('markdown-editor').value, images })], {type: "application/json"});
        saveWithDialog(blob, root + "_workspace.json", "Workspace JSON", "application/json", "json");
    }

    function exportMarkdown() {
        const root = (document.getElementById('root-name').value || "engagement").replace(/[^\w\s-]/gi, '_');
        const blob = new Blob([document.getElementById('markdown-editor').value], {type: "text/markdown"});
        saveWithDialog(blob, root + "_notes.md", "Markdown File", "text/markdown", "md");
    }

    function loadData(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const data = JSON.parse(e.target.result);
                document.getElementById('markdown-editor').value = data.markdown;
                images = data.images || [];
                document.getElementById('gallery').innerHTML = '';
                images.forEach(img => renderGalleryItem(img.id, img.data, img.name));
                parseNotesToGraph();
            } catch(e) { alert("Invalid workspace file."); }
        };
        reader.readAsText(input.files[0]);
    }

    // ==========================================
    // SCREENSHOT HANDLING
    // ==========================================
    window.addEventListener('paste', e => {
        if(document.activeElement === document.getElementById('markdown-editor')) return;
        const item = Array.from(e.clipboardData.items).find(x => x.type.indexOf('image') !== -1);
        if (item) {
            let name = `screenshot_${images.length + 1}`;
            try {
                let userPrompt = prompt("Name screenshot (optional):", name);
                if (userPrompt === null) return;
                if (userPrompt.trim() !== '') name = userPrompt;
            } catch(err) {}
            name = name.replace(/[^a-zA-Z0-9_\-\.]/g, '_') + '.png';
            processImage(item.getAsFile(), name);
        }
    });

    function handleFileUpload(input) {
        if (input.files[0]) {
            let name = input.files[0].name ? input.files[0].name.replace(/\.[^/.]+$/, "") : `screenshot_${images.length + 1}`;
            try {
                let userPrompt = prompt("Name screenshot (optional):", name);
                if (userPrompt === null) { input.value = ''; return; }
                if (userPrompt.trim() !== '') name = userPrompt;
            } catch(err) {}
            name = name.replace(/[^a-zA-Z0-9_\-\.]/g, '_') + '.png';
            processImage(input.files[0], name);
            input.value = '';
        }
    }

    function processImage(file, name) {
        const reader = new FileReader();
        reader.onload = ev => {
            const id = "img_" + Date.now();
            images.push({ id, name, data: ev.target.result });
            renderGalleryItem(id, ev.target.result, name);
        };
        reader.readAsDataURL(file);
    }

    function renderGalleryItem(id, data, name) {
        const div = document.createElement('div');
        div.className = 'gallery-item'; div.id = id;
        div.innerHTML = `<button class="img-del-btn" onclick="deleteImage('${id}')">×</button><img src="${data}" class="thumb" onclick="openLightbox(this.src)" title="${name}"><div class="img-label" title="${name}">${name}</div>`;
        document.getElementById('gallery').prepend(div);
    }

    function deleteImage(id) { images = images.filter(img => img.id !== id); document.getElementById(id).remove(); }
    function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display='flex'; }
    function resetAll() { if(confirm("Reset Workspace?")) { images = []; document.getElementById('gallery').innerHTML = ''; document.getElementById('markdown-editor').value = document.getElementById('default-template').value.trim(); parseNotesToGraph(); } }
    window.addEventListener('resize', () => { if (network) network.fit(); });
</script>
</body>
</html>
